name: Build & Publish MCP Server Image

on:
  push:
    branches:
      - main
      - master
      - work_20260527
    paths:
      - 'ArcGISMonitorExcelReporterMcp/**'
      - 'ArcGISMonitorExcelReporterMcp.Tests/**'
      - 'ArcGISMonitorExcelReporterLib/**'
      - '.github/workflows/mcp-deploy.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/desarrollosig-net/arcgis-monitor-excel-reporter-mcp

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ArcGISMonitorExcelReporterMcp.Tests/ArcGISMonitorExcelReporterMcp.Tests.csproj

      - name: Test
        run: dotnet test ArcGISMonitorExcelReporterMcp.Tests/ArcGISMonitorExcelReporterMcp.Tests.csproj --configuration Release --no-restore

  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is the repo root because the Dockerfile COPYs both
      # ArcGISMonitorExcelReporterMcp/ and ArcGISMonitorExcelReporterLib/.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ArcGISMonitorExcelReporterMcp/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only known-good pushes reach production; work_20260527 stays limited to build+push above.
    # Skipped while AZURE_CLIENT_ID isn't set (blocked on an Entra ID app registration
    # pending admin approval) -- deploys stay manual (`az containerapp update`) until then.
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && vars.MCP_OIDC_READY == 'true'

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ca-arcgis-mcp \
              --resource-group rg-arcgis-mcp \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }}
