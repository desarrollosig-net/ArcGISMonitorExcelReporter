name: Build & Publish MCP Server Image

on:
  push:
    branches:
      - main
      - master
      - work_20260527
    paths:
      - 'ArcGISMonitorExcelReporterMcp/**'
      - 'ArcGISMonitorExcelReporterMcp.Tests/**'
      - 'ArcGISMonitorExcelReporterLib/**'
      - '.github/workflows/mcp-deploy.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/desarrollosig-net/arcgis-monitor-excel-reporter-mcp

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ArcGISMonitorExcelReporterMcp.Tests/ArcGISMonitorExcelReporterMcp.Tests.csproj

      - name: Test
        run: dotnet test ArcGISMonitorExcelReporterMcp.Tests/ArcGISMonitorExcelReporterMcp.Tests.csproj --configuration Release --no-restore

  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is the repo root because the Dockerfile COPYs both
      # ArcGISMonitorExcelReporterMcp/ and ArcGISMonitorExcelReporterLib/.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ArcGISMonitorExcelReporterMcp/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    # TEMP: also allow work_20260527 to validate the deploy job end-to-end before merging.
    # Remove work_20260527 from this condition once verified.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work_20260527'

    steps:
      # Client-secret login, not OIDC: creating a new Entra ID app registration (required for
      # federated-credential/OIDC) is blocked by tenant policy for this account. This reuses an
      # existing owned app (sp-az400-azdo) scoped to rg-arcgis-mcp only via a dedicated secret.
      - name: Azure login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Update Container App image
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade -o none
            az containerapp update \
              --name ca-arcgis-mcp \
              --resource-group rg-arcgis-mcp \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }}
